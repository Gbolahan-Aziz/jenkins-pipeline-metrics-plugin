credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: SYSTEM
              id: "pipeline-metrics-db"
              username: "dbuser"
              password: "s3cret"
              description: "Pipeline Metrics DB"

unclassified:
  pipelineMetrics:
    collectionEnabled: true
    retentionDays: 45
    backfillLimit: 250
    storageBackend:
      postgresql:
        host: "pg.internal"
        port: 5432
        database: "jenkins_metrics"
        credentialsId: "pipeline-metrics-db"
        useSsl: true
        maxPoolSize: 10
